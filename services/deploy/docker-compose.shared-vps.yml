name: mobius-launch

services:
  mobius-launch:
    build:
      context: ../mobius_launch
      args:
        MOBIUS_LAUNCH_SOURCE_REPO: ${MOBIUS_LAUNCH_SOURCE_REPO:-mobius-os/mobius-os.github.io}
        MOBIUS_LAUNCH_SOURCE_PATH: ${MOBIUS_LAUNCH_SOURCE_PATH:-services/mobius_launch}
        MOBIUS_LAUNCH_GIT_SHA: ${MOBIUS_LAUNCH_GIT_SHA:-unknown}
        MOBIUS_LAUNCH_IMAGE_REF: ${MOBIUS_LAUNCH_IMAGE_REF:-mobius-launch-mobius-launch:latest}
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - MOBIUS_LAUNCH_DEPLOY_MODE=${MOBIUS_LAUNCH_DEPLOY_MODE:-shared-vps}
      - APP_BASE_PATH=
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://www.mobius.you}
      - PUBLIC_CANONICAL_URL=${PUBLIC_CANONICAL_URL:-https://www.mobius.you}
      - PUBLIC_HOSTS=${PUBLIC_HOSTS:-www.mobius.you,mobius.you,www.mobius.page,mobius.page}
      - DATA_DIR=/data
      - RAILWAY_CLIENT_ID=${RAILWAY_CLIENT_ID:-}
      - RAILWAY_CLIENT_SECRET=${RAILWAY_CLIENT_SECRET:-}
      - RAILWAY_OAUTH_SCOPES=${RAILWAY_OAUTH_SCOPES:-openid email profile offline_access workspace:member}
      - RAILWAY_TEMPLATE_URL=${RAILWAY_TEMPLATE_URL:-https://railway.com/deploy/xVMuX9?referralCode=cERpKq&utm_medium=integration&utm_source=template&utm_campaign=generic}
      - RAILWAY_TEMPLATE_CODE=${RAILWAY_TEMPLATE_CODE:-xVMuX9}
      - RAILWAY_REFERRAL_CODE=${RAILWAY_REFERRAL_CODE:-cERpKq}
      - RAILWAY_SIGNUP_URL=${RAILWAY_SIGNUP_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - ALLOW_PROTOTYPE_EMAIL_LOGIN=${ALLOW_PROTOTYPE_EMAIL_LOGIN:-false}
      - MOBIUS_DEFAULT_VOLUME_SIZE_GB=${MOBIUS_DEFAULT_VOLUME_SIZE_GB:-2}
      - MOBIUS_VOLUME_SIZE_OPTIONS_GB=${MOBIUS_VOLUME_SIZE_OPTIONS_GB:-2,5,10,20}
      - PROVISIONING_STALE_SECONDS=${PROVISIONING_STALE_SECONDS:-900}
    volumes:
      - mobius_launch_data:/data
    networks:
      edge-launch:
        aliases:
          - mobius-launch

volumes:
  mobius_launch_data:
    name: ${MOBIUS_LAUNCH_VOLUME:-deploy_mobius_launch_data}
    external: true

# The launcher's trust-zone network on the shared edge (see the edge repo's
# manifest.json). Only the edge proxy and this service join it.
networks:
  edge-launch:
    name: edge-launch
    external: true
