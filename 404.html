<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=https://www.mobius.you/">
  <link rel="canonical" href="https://www.mobius.you/">
  <title>Möbius has moved to mobius.you</title>
  <script>
    const destination = new URL("https://www.mobius.you/");
    if (window.location.pathname.startsWith("/apps")) destination.hash = "apps";
    destination.search = window.location.search;
    window.location.replace(destination.toString());
  </script>
</head>
<body>
  <p>Möbius has moved to <a href="https://www.mobius.you/">mobius.you</a>.</p>
</body>
</html>
